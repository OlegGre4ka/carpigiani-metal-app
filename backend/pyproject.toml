[project]
name = "carpigiani-metal-backend"
version = "0.1.0"
description = ""
requires-python = ">=3.14"

dependencies = [
    "fastapi (>=0.143.3,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "sqlalchemy (>=2.1,<3.0)",
    "alembic (>=1.20,<2.0)",
    "psycopg[binary] (>=3.3,<4.0)",
    "pydantic-settings (>=2.16,<3.0)",
    "bcrypt (>=4.3,<6)",
    "python-jose[cryptography] (>=3.5,<4)",
    "email-validator (>=2.2,<3)",
    "pillow (>=12,<13)",
    "nh3 (>=0.3,<0.4)"
]


[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"