# Live (server) mode. Start: docker compose -f docker-compose.prod.yml up -d --build
# Differences from docker-compose.yml (development):
# - the site is built and started, no hot reload, no file watching;
# - no Mailpit; email goes only if SMTP_* is set in .env (requests are saved anyway);
# - only the site is reachable, and only from this server (127.0.0.1:3110) - Nginx passes visitors to it;
# - the database and the API are not reachable from outside.
name: carpigiani-metal

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        BACKEND_URL: http://backend:8000
    container_name: carpigiani-metal-frontend
    ports:
      - "127.0.0.1:3110:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: carpigiani-metal-backend
    command: sh -c "alembic upgrade head && python -m app.services.create_admins && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Admin panel login
      JWT_SECRET: ${JWT_SECRET}
      OLEH_ADMIN_EMAIL: ${OLEH_ADMIN_EMAIL:-}
      OLEH_ADMIN_PASSWORD: ${OLEH_ADMIN_PASSWORD:-}
      FOFKA_ADMIN_EMAIL: ${FOFKA_ADMIN_EMAIL:-}
      FOFKA_ADMIN_PASSWORD: ${FOFKA_ADMIN_PASSWORD:-}
      # Address of the site for links in emails
      SITE_URL: ${SITE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Email (empty = not sent; the error is only written to the log)
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Carpigiani <noreply@carpigiani.com.ua>}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-info@carpigiani.com.ua}
      # AI in the admin panel: a table from a picture
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: carpigiani-metal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads:
